# Production-ready Docker Compose configuration for AI/ML Platform.
# Services:
#   - db: PostgreSQL 18 with persistent volume and health check
#   - migration: One-off migration container running `alembic upgrade head`
#   - app: FastAPI backend production ASGI server
#   - worker: Dedicated background task execution worker
#   - frontend: Production React SPA served via Nginx with API reverse proxy

name: aiproject

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aiproject}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    security_opt:
      - "no-new-privileges:true"


  migration:
    build:
      context: .
    image: aiproject-backend:${APP_VERSION:-0.4.0}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiproject}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aiproject}
      APP_ENV: production
      DEBUG: "false"
      RUN_MIGRATIONS: "true"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    networks:
      - backend
    restart: "no"

  app:
    build:
      context: .
      args:
        INSTALL_LLM: ${INSTALL_LLM:-false}
        INSTALL_NLP: ${INSTALL_NLP:-false}
    image: aiproject-backend:${APP_VERSION:-0.4.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiproject}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aiproject}
      APP_ENV: production
      DEBUG: "false"
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      UPLOAD_DIR: /data/uploads
      MODEL_DIR: /data/trained_models
      AI_MODEL_CACHE_DIR: /data/model_cache
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-insecure-dev-secret-key-change-in-production-min-32-bytes}
    volumes:
      - uploads:/data/uploads
      - models:/data/trained_models
      - model_cache:/data/model_cache
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - backend
      - frontend

  worker:
    build:
      context: .
    image: aiproject-backend:${APP_VERSION:-0.4.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiproject}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aiproject}
      APP_ENV: production
      DEBUG: "false"
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      UPLOAD_DIR: /data/uploads
      MODEL_DIR: /data/trained_models
      AI_MODEL_CACHE_DIR: /data/model_cache
    command: ["python", "scripts/run_worker.py"]
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_health.py", "--max-age-seconds", "30"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - uploads:/data/uploads
      - models:/data/trained_models
      - model_cache:/data/model_cache
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
    image: aiproject-frontend:${APP_VERSION:-0.4.0}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  pgdata:
  uploads:
  models:
  model_cache:
