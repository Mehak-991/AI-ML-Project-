# Opt-in Prometheus for the AIProject API. Not part of the default stack:
#
#   1. Create the token (once) and keep the SAME value in .env as METRICS_TOKEN:
#        python -c "import secrets; print(secrets.token_urlsafe(32))"
#        -> save it to monitoring/secrets/metrics_token (no trailing newline) and to .env
#      then recreate the app so it enforces the token.
#   2. $env:APP_VERSION = "0.5.0-p21"
#      docker compose -f compose.yaml -f compose.monitoring.yaml up -d --no-build prometheus
#
# /metrics stays hidden on the public nginx entry point. Prometheus is published on 127.0.0.1
# only (change PROMETHEUS_BIND deliberately if you need more, and put authentication in front).
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=:9090
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/secrets/metrics_token:/etc/prometheus/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    networks:
      - backend
      - frontend

volumes:
  prometheus_data:
