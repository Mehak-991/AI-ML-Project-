# Production-ready Docker Compose configuration for AI/ML Platform.
# Services:
#   - db: PostgreSQL 18 with persistent volume and health check
#   - migration: One-off migration container running `alembic upgrade head`
#   - app: FastAPI backend production ASGI server
#   - worker: Dedicated background task execution worker
#   - frontend: Production React SPA served via Nginx with API reverse proxy

name: aiproject

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aiproject}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1g


  migration:
    build:
      context: .
    image: aiproject-backend:${APP_VERSION:-0.4.0}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiproject}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aiproject}
      APP_ENV: production
      DEBUG: "false"
      RUN_MIGRATIONS: "true"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - backend
    restart: "no"

  app:
    build:
      context: .
      args:
        INSTALL_LLM: ${INSTALL_LLM:-false}
        INSTALL_NLP: ${INSTALL_NLP:-false}
    image: aiproject-backend:${APP_VERSION:-0.4.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiproject}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aiproject}
      APP_ENV: production
      DEBUG: "false"
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      # Trust X-Forwarded-For only from the bundled nginx (fixed address below).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-${FRONTEND_PROXY_IP:-172.21.0.10}}
      UPLOAD_DIR: /data/uploads
      MODEL_DIR: /data/trained_models
      AI_MODEL_CACHE_DIR: /data/model_cache
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    mem_limit: 2g
    volumes:
      - uploads:/data/uploads
      - models:/data/trained_models
      - model_cache:/data/model_cache
    # Root filesystem is read-only; runtime writes go to the volumes above or /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - backend
      - frontend

  worker:
    build:
      context: .
    image: aiproject-backend:${APP_VERSION:-0.4.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiproject}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aiproject}
      APP_ENV: production
      DEBUG: "false"
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      UPLOAD_DIR: /data/uploads
      MODEL_DIR: /data/trained_models
      AI_MODEL_CACHE_DIR: /data/model_cache
    command: ["python", "scripts/run_worker.py"]
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_health.py", "--max-age-seconds", "30"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - uploads:/data/uploads
      - models:/data/trained_models
      - model_cache:/data/model_cache
    # Root filesystem is read-only; the heartbeat file lives on the /tmp tmpfs.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 2g
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
    image: aiproject-frontend:${APP_VERSION:-0.4.0}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-80}:80"
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    networks:
      frontend:
        # Fixed so the API can trust this proxy's X-Forwarded-For (FORWARDED_ALLOW_IPS).
        ipv4_address: ${FRONTEND_PROXY_IP:-172.21.0.10}

networks:
  backend:
    internal: true
  frontend:
    ipam:
      config:
        - subnet: ${FRONTEND_SUBNET:-172.21.0.0/16}

volumes:
  pgdata:
  uploads:
  models:
  model_cache:
