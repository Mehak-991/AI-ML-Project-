name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint-and-test:
    name: Backend Regression & Lint (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter & Security Checks
        run: |
          ruff check . --select=E9,F63,F7,F82,S

      - name: Security audit Python dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Run Backend Regression Test Suite
        env:
          APP_ENV: testing
          DOCS_ENABLED: "true"
          RATE_LIMIT_ENABLED: "false"
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Test Alembic Migrations & Schema Compatibility
        run: |
          pytest tests/integration/test_migrations.py -v --tb=short

  frontend-build:
    name: Frontend Typecheck, Audit & Build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Security audit Frontend dependencies
        working-directory: frontend
        run: |
          npm audit --audit-level=high

      - name: Frontend Build & Typecheck
        working-directory: frontend
        run: |
          npm run build

  docker-dry-run-build:
    name: Docker Multi-Stage Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aiproject-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aiproject-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
