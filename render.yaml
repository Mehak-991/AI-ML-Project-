# Render Blueprint: FastAPI backend (Docker) + PostgreSQL.
# Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
# The React frontend is deployed separately on Vercel (frontend/vercel.json).
#
# Free-plan limits: the web service sleeps after ~15 min idle (first request then takes
# about a minute), 512 MB RAM, and NO persistent disk: uploaded datasets and trained models
# are lost on every restart/redeploy (users, employees and audit logs live in PostgreSQL and
# are kept). For permanent files switch the service to a paid plan and add a disk on /data.

databases:
  - name: aiml-db
    databaseName: aiproject
    user: aiproject
    plan: free
    region: singapore

services:
  - type: web
    name: aiml-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render's dockerCommand REPLACES the image ENTRYPOINT (it does not just override CMD), so
    # the entrypoint is called explicitly: it validates the configuration and runs
    # `alembic upgrade head` (RUN_MIGRATIONS=true), then execs uvicorn with these arguments.
    # One worker fits the free plan's 512 MB.
    dockerCommand: >-
      python scripts/docker_entrypoint.py
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --no-access-log
      --workers 1 --timeout-graceful-shutdown 20
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: aiml-db
          property: connectionString
      # Random 256-bit secret generated by Render (never stored in git).
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: METRICS_AUTH_TOKEN
        generateValue: true
      # Set in the dashboard after the Vercel deploy, e.g. https://aiml-project.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Render's proxy sits in front of the container; trust it for real client IPs.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DOCS_ENABLED
        value: "true"
      # No Ollama server on Render: report it as disabled instead of probing it.
      - key: OLLAMA_HEALTHCHECK_ENABLED
        value: "false"
      - key: AI_ALLOW_MODEL_DOWNLOADS
        value: "false"
