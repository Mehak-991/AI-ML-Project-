# Opt-in HTTPS for the bundled nginx. Not used unless you add it explicitly:
#
#   $env:APP_VERSION = "0.5.0-p21"
#   $env:TLS_CERT_DIR = "C:\path\to\certs"     # folder with fullchain.pem and privkey.pem
#   docker compose -f compose.yaml -f compose.tls.yaml up -d --no-build --wait
#
# You supply the certificate (no certificate is created or assumed). If a load balancer or
# another proxy terminates TLS in front of nginx, do NOT use this file; see TLS_DEPLOYMENT.md.
services:
  frontend:
    ports:
      # Merged with compose.yaml's "${FRONTEND_PORT:-80}:80", which stays as the redirect + health port.
      - "${FRONTEND_TLS_PORT:-443}:443"
    volumes:
      - ./frontend/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to the folder holding fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
