[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiproject"
version = "0.4.0"
description = "Modular, production-oriented AI/ML application platform."
readme = "README.md"
requires-python = ">=3.12"
# Core runtime. Keep in sync with requirements.txt.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.18,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "SQLAlchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
    "openpyxl>=3.1,<4.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
]

[project.optional-dependencies]
# Development and testing. Keep in sync with requirements-dev.txt.
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.8,<1.0",
]
# --- Optional AI groups (Part 3). The core API runs without any of them. ---------
# Install PyTorch FIRST from the index matching your hardware (see README), e.g.
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
# Otherwise pip may pull a large CUDA build on Linux.
torch = [
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
]
# Local NLP: embeddings, transformer inference, datasets/metrics for evaluation.
# Needs torch (above). transformers v4 and v5 are both accepted.
nlp = [
    "transformers>=4.44,<6",
    "sentence-transformers>=3.0,<7",
    "datasets>=3.0,<6",
    "evaluate>=0.4,<0.5",
]
# Hosted LLM provider + token counting. Tested with openai 2.54 and 3.40.
llm = [
    "openai>=2.0,<4",
    "tiktoken>=0.8,<1",
]
# Workflow orchestration (LangGraph) and token-aware chunking (LangChain splitters).
# Tested with langgraph 1.2, langchain-core 1.7, langchain-text-splitters 1.1.
agents = [
    "langgraph>=0.2,<2",
    "langchain-core>=0.3,<2",
    "langchain-text-splitters>=0.3,<2",
]
# Reserved for the RAG phase (Part 4); no code depends on it yet.
rag = [
    "llama-index-core>=0.12,<0.15",
]
# Everything except torch (install torch explicitly for your hardware first).
ai = [
    "aiproject[nlp,llm,agents]",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need external services (e.g. PostgreSQL via TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
