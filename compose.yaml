# Production-ready Docker Compose configuration for AI/ML Platform.
# Services:
#   - db: PostgreSQL 18 with persistent volume and health check
#   - migration: One-off migration container running `alembic upgrade head`
#   - app: FastAPI backend production ASGI server
#   - worker: Dedicated background task execution worker
#   - frontend: Production React SPA served via Nginx with API reverse proxy

name: aiproject

# One definition: app, worker and migration share an image tag, so differing build args would
# overwrite each other (e.g. drop the LLM packages from the API's image).
x-backend-build: &backend-build
  context: .
  args:
    INSTALL_LLM: ${INSTALL_LLM:-false}
    INSTALL_NLP: ${INSTALL_NLP:-false}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aiproject}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1g


  migration:
    build: *backend-build
    image: aiproject-backend:${APP_VERSION:?Set APP_VERSION to the release tag, e.g. APP_VERSION=0.5.0-p21 (no default on purpose)}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiproject}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aiproject}
      APP_ENV: production
      DEBUG: "false"
      DATABASE_ECHO: "false"
      RUN_MIGRATIONS: "true"
      APP_RELEASE: ${APP_VERSION}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - backend
    restart: "no"

  app:
    build: *backend-build
    image: aiproject-backend:${APP_VERSION:?Set APP_VERSION to the release tag, e.g. APP_VERSION=0.5.0-p21 (no default on purpose)}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiproject}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aiproject}
      APP_ENV: production
      DEBUG: "false"
      DATABASE_ECHO: "false"
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      APP_RELEASE: ${APP_VERSION}
      # Swagger UI and the OpenAPI schema stay off in production unless asked for.
      DOCS_ENABLED: ${PROD_DOCS_ENABLED:-false}
      # Trust X-Forwarded-For only from the bundled nginx (fixed address below). Deliberately not
      # FORWARDED_ALLOW_IPS from .env: the host-development value (127.0.0.1) would make every
      # client share nginx's address, and with it one login and API rate-limit budget.
      FORWARDED_ALLOW_IPS: ${FRONTEND_PROXY_IP:-172.21.0.10}
      UPLOAD_DIR: /data/uploads
      MODEL_DIR: /data/trained_models
      AI_MODEL_CACHE_DIR: /data/model_cache
      # Jobs run in the dedicated worker service, not in the API's memory.
      JOB_INLINE_DISPATCH: "false"
      # On the volume shared with the worker, so /metrics can see its heartbeat.
      WORKER_HEARTBEAT_FILE: /data/model_cache/.worker_heartbeat
      # A container's 127.0.0.1 is itself; Ollama runs on the Docker host.
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 30s
    mem_limit: 2g
    volumes:
      - uploads:/data/uploads
      - models:/data/trained_models
      - model_cache:/data/model_cache
    # Root filesystem is read-only; runtime writes go to the volumes above or /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - backend
      - frontend

  worker:
    build: *backend-build
    image: aiproject-backend:${APP_VERSION:?Set APP_VERSION to the release tag, e.g. APP_VERSION=0.5.0-p21 (no default on purpose)}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiproject}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aiproject}
      APP_ENV: production
      DEBUG: "false"
      DATABASE_ECHO: "false"
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      APP_RELEASE: ${APP_VERSION}
      UPLOAD_DIR: /data/uploads
      MODEL_DIR: /data/trained_models
      AI_MODEL_CACHE_DIR: /data/model_cache
      WORKER_HEARTBEAT_FILE: /data/model_cache/.worker_heartbeat
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    command: ["python", "scripts/run_worker.py"]
    # Time for in-flight jobs to finish; anything still running is recovered by the reaper.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_health.py", "--max-age-seconds", "30"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - uploads:/data/uploads
      - models:/data/trained_models
      - model_cache:/data/model_cache
    # Root filesystem is read-only; runtime writes go to the volumes above or /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 2g
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
    image: aiproject-frontend:${APP_VERSION:?Set APP_VERSION to the release tag, e.g. APP_VERSION=0.5.0-p21 (no default on purpose)}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=1777,noexec,nosuid
      - /run:size=8m,mode=1777,noexec,nosuid
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    networks:
      frontend:
        # Fixed so the API can trust this proxy's X-Forwarded-For (FORWARDED_ALLOW_IPS).
        ipv4_address: ${FRONTEND_PROXY_IP:-172.21.0.10}

networks:
  backend:
    internal: true
  frontend:
    ipam:
      config:
        - subnet: ${FRONTEND_SUBNET:-172.21.0.0/16}

volumes:
  pgdata:
  uploads:
  models:
  model_cache:
