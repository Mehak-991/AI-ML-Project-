# Plain-HTTP entry point (default, local development and TLS-terminated-upstream deployments).
# The server body lives in server-common.inc; HTTPS is opt-in via nginx.tls.conf (TLS_DEPLOYMENT.md).

# Docker's embedded DNS. Resolving at request time means a recreated `app` container (new IP)
# keeps working without reloading nginx, and nginx can start before `app` exists.
resolver 127.0.0.11 valid=10s ipv6=off;

# Do not advertise the nginx version in headers or error pages.
server_tokens off;

server {
    listen 80;
    server_name localhost;

    include /etc/nginx/conf.d/server-common.inc;
}
