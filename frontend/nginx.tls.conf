# Opt-in HTTPS entry point. Mounted over conf.d/default.conf by compose.tls.yaml; nothing here
# runs unless you deploy with that override and provide your own certificate.
#
# Expected files (read-only mount from TLS_CERT_DIR):
#   /etc/nginx/tls/fullchain.pem   certificate chain
#   /etc/nginx/tls/privkey.pem     private key (keep it out of Git and unreadable to other users)

resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;

# Port 80: redirect everything to HTTPS, except the container health check.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/server-common.inc;
}
