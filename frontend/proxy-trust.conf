# http-level definitions shared by the HTTP and TLS server configs (loaded from conf.d/*.conf).
#
# $forwarded_proto is what the API is told about the ORIGINAL request scheme:
#   * nginx terminates TLS itself (nginx.tls.conf)       -> "https" ($scheme).
#   * plain HTTP, nothing in front                        -> "http"  ($scheme).
#   * another TLS terminator (cloud load balancer, Caddy, Traefik, ...) in front of nginx -> the
#     value it sends in X-Forwarded-Proto, but ONLY when the request comes from an address listed
#     below. For anyone else the header is ignored, so a client cannot claim "https".
#
# To put a TLS terminator in front, list its address(es) here, mount this file over
# /etc/nginx/conf.d/00-proxy-trust.conf, and keep FORWARDED_ALLOW_IPS on the API pointing at
# nginx only (see TLS_DEPLOYMENT.md). Real client IPs behind that proxy additionally need
#   set_real_ip_from <proxy address or CIDR>;  real_ip_header X-Forwarded-For;  real_ip_recursive on;
# in this file. Nothing is trusted by default.
geo $trusted_tls_proxy {
    default 0;
    # 10.0.0.5/32 1;
}

map "$trusted_tls_proxy:$http_x_forwarded_proto" $forwarded_proto {
    "1:https" https;
    "1:http"  http;
    default   $scheme;
}

# Sent only on HTTPS connections: nginx omits a header whose value is empty. Start with a short
# max-age while you are testing; add includeSubDomains/preload only when every subdomain is HTTPS.
map $forwarded_proto $hsts_header {
    https   "max-age=31536000";
    default "";
}
